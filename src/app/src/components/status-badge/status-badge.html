<span class="p-2 flex col-span-2 justify-center" 
    [ngClass]="{'bg-blue-100 text-blue-600': status() === 'NEW', 'bg-amber-100 text-amber-600': status() === 'ON_GOING', 
    'bg-green-100 text-green-600': status() === 'VALIDATED',
    'bg-red-100 text-red-600': status() === 'REJECTED'}">

    @switch (status()) {
        @case ("NEW") {
            <span>Nouveau</span>
        }
        @case("ON_GOING") {
            <span>En cours</span>
        }
        @case("REJECTED") {
            <span>Rejeté</span>
        }
        @default{
            <span>Validé</span>
        }
    }
</span>
