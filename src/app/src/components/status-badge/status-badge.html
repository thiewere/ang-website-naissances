<span class="p-2 flex col-span-2 justify-center" 
    [ngClass]="{'bg-blue-100 text-blue-400': status() === 'NEW', 'bg-orange-100 text-orange-400': status() === 'ON_GOING', 
    'bg-green-50 text-green-500': status() === 'VALIDATED',
    'bg-red-100 text-red-400': status() === 'REJECTED'}">
    
    @switch (status()) {
        @case ("NEW") {
            <span>Nouveau</span>
        }
        @case("ON_GOING") {
            <span>En cours</span>
        }
        @case("REJECTED") {
            <span>Rejeté</span>
        }
        @default{
            <span>Validé</span>
        }
    }
</span>
